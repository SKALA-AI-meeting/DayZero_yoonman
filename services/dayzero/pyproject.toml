[project]
name = "dayzero"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3",
 "psycopg[binary,pool]>=3.2,<4", "alembic>=1.14,<2", "pgvector>=0.3,<1",
 "aio-pika>=9.5,<10", "langgraph>=1,<2", "langgraph-checkpoint-postgres>=3,<4",
 "mcp>=1.12,<2", "openai>=2,<3", "pydantic-settings>=2.7,<3", "pyjwt>=2.10,<3",
 "httpx>=0.28,<1", "argon2-cffi>=23,<26"
]
[project.optional-dependencies]
rag = ["sentence-transformers>=5,<6"]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 110
